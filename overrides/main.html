{% extends "base.html" %}

{# The theme links favicon.ico; add the vector icon for modern browsers and the iOS home-screen icon. #}
{% block site_meta %}
  {{ super() }}
  <link rel="icon" href="{{ 'assets/logo.svg' | url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ 'assets/apple-touch-icon.png' | url }}">
{% endblock %}

{% block fonts %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
{% endblock %}

{% block scripts %}
  <!-- Add scripts that need to run before here -->
  {{ super() }}

  <script>
    // Instant navigation keeps the custom header, so refresh its active section.
    document$.subscribe(function () {
      document.querySelectorAll('.qd-header-link').forEach(function (link) {
        var target = new URL(link.href);
        var current = target.origin === location.origin &&
          (target.pathname === location.pathname ||
            (target.pathname !== '/' && location.pathname.startsWith(target.pathname)));
        if (current) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
    });
  </script>

  <!-- Matomo -->
